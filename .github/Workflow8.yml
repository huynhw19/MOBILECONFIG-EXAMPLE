name: Stale Issues

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: 'This issue has been inactive for a while. Please provide an update or it may be closed.'
          stale-pr-message: 'This pull request has been inactive for a while. Please provide an update.'
          exempt-issue-labels: 'security,do-not-close,triaged'
